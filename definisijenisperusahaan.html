        body {

        .option.wrong {

        }

            color: #6b7280;
            font-size: 0.9rem;

        .controls {
            margin-top: 14px;
        }

        .summary {
            background: #fff;
            border: 1px solid #e6e9ee;
            padding: 12px;

            margin-top: 12px;

        }

        .review-note {
            font-size: 0.9rem;

        }

        .pager {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .pager .btn-num {
            min-width: 36px;
            height: 36px;
            padding: 0 8px;

            background: #ffffff;
            border: 1px solid #e2e8f0;

        }

            background: #eaf7e8;
            color: #1b3a1b;
            border-color: #cfe9cf;
        }

        .btn-num.current {
            box-shadow: 0 0 0 3px rgba(34, 139, 34, 0.06);

        .timer {
            font-weight: 700;
            color: #0b5e3a;

            color: #7a1b1b;

        }

        .invisible {
            display: none !important;
        }

        @media (max-width:576px) {
            .option {
                padding: 14px 16px;
                font-size: 1rem;
            }

            .pager .btn-num {
                min-width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
        }
        </style>
    </head>

        <!-- Konfigurasi AJAX (isi sendiri) -->
        <script>
        const POST_URL = ""; // <-- isi URL endpoint POST di sini
        const REDIRECT_URL = ""; // <-- isi URL tujuan setelah menutup notifikasi
        </script>

            },
            {

                stem: "Perusahaan yang memiliki kantor pusat di satu negara tetapi menjalankan kegiatan di lebih dari satu negara disebut ... ?",
                options: ["Perusahaan lokal", "Perusahaan nasional", "Perusahaan internasional", "Perusahaan BUMN"],
                correctIndex: 2
            },
            {
                id: 17,
                stem: "Perusahaan induk yang didirikan untuk memiliki saham atau aset perusahaan lain disebut ... ?",
                options: ["Perusahaan operasional", "Perusahaan holding", "Perusahaan joint venture",
                    "Perusahaan distributor"
                ],
                correctIndex: 1
            },
            {
                id: 18,
                stem: "Perusahaan yang menjalankan kegiatan usaha sehari-hari secara langsung untuk menghasilkan barang atau jasa disebut ... ?",
                options: ["Perusahaan holding", "Perusahaan operasional", "Perusahaan retailer",
                    "Perusahaan manufaktur"
                ],
                correctIndex: 1
            },
            {
                id: 19,
                stem: "Perusahaan yang didirikan berdasarkan kerja sama antara dua pihak atau lebih untuk menjalankan usaha bersama disebut ... ?",
                options: ["Perusahaan joint venture", "Perusahaan perorangan", "Perusahaan firma",
                    "Perusahaan BUMN"],
                correctIndex: 0
            },
            {
                id: 20,
                stem: "Perusahaan yang berfungsi menyalurkan barang dari produsen kepada pengecer atau konsumen akhir disebut ... ?",
                options: ["Perusahaan retailer", "Perusahaan distributor", "Perusahaan manufaktur",
                    "Perusahaan jasa"
                ],
                correctIndex: 1
            }
        ];

        /* ===== Helpers ===== */
        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        /* Shuffle questions and options while preserving correctIndex */
        function prepareQuestions(raw) {
            const qshuffled = shuffleArray(raw);
            return qshuffled.map(q => {
                const opts = q.options.map((t, idx) => ({
                    text: t,
                    origIdx: idx
                }));
                const shuffledOpts = shuffleArray(opts);
                const newCorrectIndex = shuffledOpts.findIndex(o => o.origIdx === q.correctIndex);
                return {
                    id: q.id,
                    stem: q.stem,
                    options: shuffledOpts.map(o => o.text),
                    correctIndex: newCorrectIndex
                };
            });
        }

        /* ===== State ===== */
        let QUESTIONS = prepareQuestions(RAW_QUESTIONS);
        let current = 0;
        const total = QUESTIONS.length;
        const answers = {}; // questionIndex -> selectedIndex
        let finished = false;

        /* Timer */
        const TOTAL_SECONDS = 3 * 60;
        let remainingSeconds = TOTAL_SECONDS;
        let timerInterval = null;

        /* DOM refs */
        const quizArea = document.getElementById('quiz-area');
        const positionEl = document.getElementById('position');
        const finishBtn = document.getElementById('finishBtn');
        const pagerEl = document.getElementById('pager');
        const answeredCountEl = document.getElementById('answered-count');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const timerEl = document.getElementById('timer');
        const idTugasEl = document.getElementById('id_tugas');

        function updatePosition() {
            positionEl.textContent = `Soal ${current+1} / ${total}`;
        }

        function clearQuizArea() {
            quizArea.innerHTML = '';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        /* Timer helpers */
        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            timerEl.textContent = formatTime(remainingSeconds);
            timerInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds <= 0) {
                    remainingSeconds = 0;
                    timerEl.textContent = formatTime(remainingSeconds);
                    timerEl.classList.add('expired');
                    clearInterval(timerInterval);
                    autoFinishByTimeout();
                } else {
                    timerEl.textContent = formatTime(remainingSeconds);
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        /* Build pager */
        function buildPager() {
            pagerEl.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-light btn-num';
                btn.textContent = (i + 1);
                btn.setAttribute('data-index', i);
                btn.addEventListener('click', () => {
                    current = i;
                    renderCurrent();
                });
                pagerEl.appendChild(btn);
            }
            refreshPagerVisuals();
        }

        /* Refresh pager visuals */
        function refreshPagerVisuals() {
            const children = Array.from(pagerEl.children);
            children.forEach((btn, idx) => {
                btn.classList.remove('answered', 'current');
                if (answers.hasOwnProperty(idx)) btn.classList.add('answered');
                if (idx === current) btn.classList.add('current');
            });
            answeredCountEl.textContent = Object.keys(answers).length;
            updatePrevVisibility();
            updateNextFinishVisibility();
        }

        /* Prev visibility */
        function updatePrevVisibility() {
            if (current === 0) prevBtn.classList.add('invisible');
            else prevBtn.classList.remove('invisible');
        }

        /* Next / Finish visibility */
        function updateNextFinishVisibility() {
            if (current === total - 1) {
                nextBtn.classList.add('invisible');
                const allAnswered = Object.keys(answers).length === total && !finished;
                if (allAnswered) finishBtn.classList.remove('invisible');
                else finishBtn.classList.add('invisible');
            } else {
                nextBtn.classList.remove('invisible');
                finishBtn.classList.add('invisible');
            }
        }

        /* Render question */
        function renderCurrent() {
            updatePosition();
            clearQuizArea();
            const q = QUESTIONS[current];
            const container = document.createElement('div');

            const qTitle = document.createElement('div');
            qTitle.innerHTML =
                `<div class="mb-2"><strong>Soal ${current+1}.</strong></div><div class="mb-3">${escapeHtml(q.stem)}</div>`;
            container.appendChild(qTitle);

            const optWrap = document.createElement('div');
            q.options.forEach((optText, idx) => {
                const opt = document.createElement('div');
                opt.className = 'option';
                opt.textContent = optText;
                opt.setAttribute('data-idx', idx);

                if (finished) {
                    if (answers[current] === idx) {
                        opt.classList.add(answers[current] === q.correctIndex ? 'correct' : 'wrong');
                    }
                    if (idx === q.correctIndex) opt.classList.add('correct');
                    opt.style.pointerEvents = 'none';
                } else {
                    if (answers[current] === idx) opt.classList.add('active');
                    opt.addEventListener('click', () => {
                        Array.from(optWrap.children).forEach(c => c.classList.remove('active'));
                        opt.classList.add('active');
                        answers[current] = idx;
                        refreshPagerVisuals();
                    });
                }

                optWrap.appendChild(opt);
            });

            container.appendChild(optWrap);
            quizArea.appendChild(container);
            refreshPagerVisuals();
        }

        /* Navigation */
        nextBtn.addEventListener('click', () => {
            if (current < total - 1) {
                current++;
                renderCurrent();
            }
        });
        prevBtn.addEventListener('click', () => {
            if (current > 0) {
                current--;
                renderCurrent();
            }
        });

        /* Build result lists and counts */
        function buildResultLists() {
            let benar = 0;
            const benarList = [];
            const salahList = [];
            QUESTIONS.forEach((q, idx) => {
                const sel = answers[idx];
                const nomor = idx + 1;
                if (sel !== undefined && sel === q.correctIndex) {
                    benar++;
                    benarList.push({
                        num: nomor,
                        stem: q.stem
                    });
                } else {
                    salahList.push({
                        num: nomor,
                        stem: q.stem,
                        correct: q.options[q.correctIndex]
                    });
                }
            });
            return {
                benar,
                benarList,
                salahList
            };
        }

        /* Send results to server: payload keys as requested */
        async function sendResultsToServer(jawaban_benar, waktu_pengerjaan) {
            const id_tugas = idTugasEl ? idTugasEl.value : "";
            const payload = {
                id_tugas: id_tugas,
                jawaban_benar: jawaban_benar,
                waktu_pengerjaan: waktu_pengerjaan
            };

            if (!POST_URL) {
                console.warn('POST_URL kosong — tidak mengirim hasil ke server.', payload);
                return {
                    ok: false,
                    message: 'POST_URL kosong'
                };
            }

            try {
                const resp = await fetch(POST_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload),
                    credentials: 'same-origin'
                });
                const text = await resp.text();
                return {
                    ok: resp.ok,
                    status: resp.status,
                    body: text
                };
            } catch (err) {
                console.error('Gagal mengirim hasil:', err);
                return {
                    ok: false,
                    error: err.message
                };
            }
        }

        /* Show detailed modal (finish) */
        function makeDetailedHtml(benarList, salahList, waktuDetik) {
            const makeListHtml = (items, isBenar) => {
                if (items.length === 0) return `<div class="small text-muted">Tidak ada</div>`;
                return `<div style="max-height:260px; overflow:auto; text-align:left;">` +
                    items.map(it => {
                        if (isBenar)
                        return `<div style="padding:6px 8px; border-radius:6px; background:#f0fff0; margin-bottom:6px;"><strong>Soal ${it.num}</strong>: ${escapeHtml(it.stem)}</div>`;
                        return `<div style="padding:6px 8px; border-radius:6px; background:#fff5f5; margin-bottom:6px;"><strong>Soal ${it.num}</strong>: ${escapeHtml(it.stem)}<div style="margin-top:6px; color:#7a1b1b;"><em>Jawaban benar:</em> ${escapeHtml(it.correct)}</div></div>`;
                    }).join('') + `</div>`;
            };

            return `<div style="display:flex; gap:12px; flex-wrap:wrap;">` +
                `<div style="flex:1; min-width:260px;"><h6 style="margin-top:0;">Jawaban Benar (${benarList.length})</h6>` +
                makeListHtml(benarList, true) + `</div>` +
                `<div style="flex:1; min-width:260px;"><h6 style="margin-top:0;">Jawaban Salah (${salahList.length})</h6>` +
                makeListHtml(salahList, false) + `</div>` +
                `</div><div style="margin-top:10px;"><small>Waktu pengerjaan: <strong>${waktuDetik}</strong> detik</small></div>`;
        }

        /* Finish handler (user clicks Selesai) */
        finishBtn.addEventListener('click', async () => {
            if (Object.keys(answers).length !== total) return;
            finished = true;
            stopTimer();

            const waktuDetik = TOTAL_SECONDS - remainingSeconds;
            const {
                benar,
                benarList,
                salahList
            } = buildResultLists();

            // lock UI and show summary
            document.getElementById('result-area').innerHTML =
                `<div class="summary">Hasil: <strong>${benar}</strong> benar dari <strong>${total}</strong> soal.</div>`;
            renderCurrent();

            // send to server
            const sendResult = await sendResultsToServer(benar, waktuDetik);
            if (!sendResult.ok) console.warn('Pengiriman hasil bermasalah:', sendResult);

            // show modal; after user closes, redirect if REDIRECT_URL set
            await Swal.fire({
                title: `Selesai — ${benar} / ${total} benar`,
                html: makeDetailedHtml(benarList, salahList, waktuDetik),
                width: Math.min(900, Math.max(600, window.innerWidth - 80)),
                icon: 'info',
                confirmButtonText: 'Tutup',
                allowOutsideClick: false
            });

            if (REDIRECT_URL) window.location.href = REDIRECT_URL;
        });

        /* Auto-finish on timeout */
        async function autoFinishByTimeout() {
            finished = true;
            stopTimer();

            const waktuDetik = TOTAL_SECONDS;
            const {
                benar,
                benarList,
                salahList
            } = buildResultLists();
            const salahCount = total - benar;

            // lock UI and show summary
            document.getElementById('result-area').innerHTML =
                `<div class="summary">Waktu habis — Hasil: <strong>${benar}</strong> benar, <strong>${salahCount}</strong> salah.</div>`;
            renderCurrent();

            // send to server
            const sendResult = await sendResultsToServer(benar, waktuDetik);
            if (!sendResult.ok) console.warn('Pengiriman hasil bermasalah:', sendResult);

            // concise modal with numbers
            const benarNums = benarList.map(i => i.num);
            const salahNums = salahList.map(i => i.num);

            const html = `
    <div style="text-align:left;">
      <p><strong>Waktu habis.</strong></p>
      <p>Benar: <strong>${benar}</strong><br>Salah: <strong>${salahCount}</strong></p>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <div style="min-width:160px;">
          <h6 style="margin:6px 0;">Soal Benar</h6>
          <div class="small text-muted">${benarNums.length ? benarNums.join(', ') : 'Tidak ada'}</div>
        </div>
        <div style="min-width:160px;">
          <h6 style="margin:6px 0;">Soal Salah</h6>
          <div class="small text-muted">${salahNums.length ? salahNums.join(', ') : 'Tidak ada'}</div>
        </div>
      </div>
    </div>
  `;

            await Swal.fire({
                title: 'Waktu Habis',
                html,
                icon: 'warning',
                width: Math.min(700, Math.max(480, window.innerWidth - 80)),
                confirmButtonText: 'Tutup',
                allowOutsideClick: false
            });

            if (REDIRECT_URL) window.location.href = REDIRECT_URL;
        }

        /* Keyboard navigation */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                if (current < total - 1) document.getElementById('nextBtn').click();
            }
            if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
        });

        /* Init */
        buildPager();
        renderCurrent();
        startTimer();
        </script>

        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
